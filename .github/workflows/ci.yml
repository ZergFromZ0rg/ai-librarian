name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  document-service:
    name: document-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: document-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: document-service/requirements-ci.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint
        run: ruff check .

      - name: Run pytest
        run: pytest -q

  ui:
    name: ui build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  status:
    name: ci
    runs-on: ubuntu-latest
    needs: [document-service, ui]
    if: always()
    permissions:
      statuses: write
    steps:
      # The two jobs above surface as check runs. Also post a legacy commit
      # status so the combined-status endpoint reads success/failure instead of
      # a permanent "pending" (which is its default when no status is posted).
      - name: Report combined commit status
        run: |
          if [ "${{ needs.document-service.result }}" = "success" ] \
             && [ "${{ needs.ui.result }}" = "success" ]; then
            state=success
          else
            state=failure
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$state\",\"context\":\"ci\",\"description\":\"tests and build\"}"
