services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    expose:
      - "6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    security_opt:
      - no-new-privileges:true

  qdrant-ready:
    image: busybox:1.37.0
    restart: "no"
    command: ["sh", "-c", "until wget -q -O - http://qdrant:6333/readyz; do sleep 2; done"]
    depends_on:
      - qdrant

  document-service:
    build:
      context: ./document-service
      dockerfile: Dockerfile
      args:
        PREBAKE_MODELS: ${PREBAKE_MODELS:-0}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - ./data/app:/app/data
      - ./library:/library:ro
      - ./data/models:/models
    environment:
      PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEARCH_LOG: ${SEARCH_LOG:-on}
      OFFLINE: ${OFFLINE:-0}
      DATA_DIR: /app/data
      INGEST_ROOT: /library
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: vault
      APP_TOKEN: ${APP_TOKEN:-}
      ALLOW_INDEX_RESET: ${ALLOW_INDEX_RESET:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
      EMBEDDING_QUERY_PREFIX: "${EMBEDDING_QUERY_PREFIX-Represent this sentence for searching relevant passages: }"
      EMBEDDING_PASSAGE_PREFIX: "${EMBEDDING_PASSAGE_PREFIX-}"
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-0}
      LEXICAL_K1: ${LEXICAL_K1:-1.5}
      LEXICAL_B: ${LEXICAL_B:-0.75}
      LEXICAL_AVGDL: ${LEXICAL_AVGDL:-180}
      FUSION_METHOD: ${FUSION_METHOD:-rrf}
      FUSION_DENSE_WEIGHT: ${FUSION_DENSE_WEIGHT:-0.5}
      RERANK_MODEL: ${RERANK_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      RERANK_PASSAGE: ${RERANK_PASSAGE:-group}
      RERANK_TIMEOUT: ${RERANK_TIMEOUT:-15}
      RERANK_CANDIDATES: ${RERANK_CANDIDATES:-60}
      RERANK_MIN_SCORE: ${RERANK_MIN_SCORE:--2.0}
      RERANK_LOWCONF_SCORE: ${RERANK_LOWCONF_SCORE:-0.0}
      GENERATION_BACKEND: ${GENERATION_BACKEND:-off}
      LLAMA_URL: ${LLAMA_URL:-http://llm:8080}
      LLAMA_MODEL: ${LLAMA_MODEL:-local-gguf}
      GENERATION_MODEL: ${GENERATION_MODEL:-claude-opus-5}
      GENERATION_MAX_TOKENS: ${GENERATION_MAX_TOKENS:-2000}
      GENERATION_TEMPERATURE: ${GENERATION_TEMPERATURE:-0.2}
      GENERATION_TIMEOUT: ${GENERATION_TIMEOUT:-120}
      ASK_CONTEXT_PASSAGES: ${ASK_CONTEXT_PASSAGES:-6}
      ASK_MAX_CONTEXT_CHARS: ${ASK_MAX_CONTEXT_CHARS:-6000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CHUNK_TARGET_TOKENS: ${CHUNK_TARGET_TOKENS:-180}
      CHUNK_SOFT_MAX_TOKENS: ${CHUNK_SOFT_MAX_TOKENS:-220}
      CHUNK_HARD_MAX_TOKENS: ${CHUNK_HARD_MAX_TOKENS:-240}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-32}
      HF_HOME: /models/huggingface
    depends_on:
      qdrant-ready:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  # Ask mode's local LLM. Opt-in: only starts under `--profile ask`, and only
  # matters when GENERATION_BACKEND=llamacpp. Drop a GGUF chat model into
  # data/models/llm/ and set LLAMA_GGUF to its filename.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["ask"]
    restart: unless-stopped
    volumes:
      - ./data/models/llm:/models:ro
    command:
      - "-m"
      - "/models/${LLAMA_GGUF:-model.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "${LLAMA_CTX:-8192}"
      - "--threads"
      - "${LLAMA_THREADS:-4}"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${UI_PORT:-3100}:8080"
    environment:
      # "Bearer <token>" when APP_TOKEN is set, empty otherwise; nginx forwards
      # it so the bundled UI keeps working when the API requires a token.
      APP_TOKEN_HEADER: "${APP_TOKEN:+Bearer }${APP_TOKEN:-}"
      NGINX_ENVSUBST_FILTER: "^APP_TOKEN_HEADER$$"
    depends_on:
      document-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
