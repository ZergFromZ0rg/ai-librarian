services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    expose:
      - "6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    security_opt:
      - no-new-privileges:true

  qdrant-ready:
    image: busybox:1.37.0
    restart: "no"
    command: ["sh", "-c", "until wget -q -O - http://qdrant:6333/readyz; do sleep 2; done"]
    depends_on:
      - qdrant

  document-service:
    build:
      context: ./document-service
      dockerfile: Dockerfile
      args:
        PREBAKE_MODELS: ${PREBAKE_MODELS:-0}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - ./data/app:/app/data
      - ./library:/library:ro
      - ./data/models:/models
    environment:
      PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEARCH_LOG: ${SEARCH_LOG:-on}
      OFFLINE: ${OFFLINE:-0}
      DATA_DIR: /app/data
      INGEST_ROOT: /library
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: vault
      APP_TOKEN: ${APP_TOKEN:-}
      ALLOW_INDEX_RESET: ${ALLOW_INDEX_RESET:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/e5-small-v2}
      EMBEDDING_QUERY_PREFIX: "${EMBEDDING_QUERY_PREFIX-query: }"
      EMBEDDING_PASSAGE_PREFIX: "${EMBEDDING_PASSAGE_PREFIX-passage: }"
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-0}
      FUSION_METHOD: ${FUSION_METHOD:-rrf}
      FUSION_DENSE_WEIGHT: ${FUSION_DENSE_WEIGHT:-0.5}
      RERANK_TIMEOUT: ${RERANK_TIMEOUT:-15}
      RERANK_CANDIDATES: ${RERANK_CANDIDATES:-60}
      RERANK_MIN_SCORE: ${RERANK_MIN_SCORE:-0.0}
      CHUNK_TARGET_TOKENS: ${CHUNK_TARGET_TOKENS:-180}
      CHUNK_SOFT_MAX_TOKENS: ${CHUNK_SOFT_MAX_TOKENS:-220}
      CHUNK_HARD_MAX_TOKENS: ${CHUNK_HARD_MAX_TOKENS:-240}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-32}
      HF_HOME: /models/huggingface
    depends_on:
      qdrant-ready:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${UI_PORT:-3100}:8080"
    environment:
      # "Bearer <token>" when APP_TOKEN is set, empty otherwise; nginx forwards
      # it so the bundled UI keeps working when the API requires a token.
      APP_TOKEN_HEADER: "${APP_TOKEN:+Bearer }${APP_TOKEN:-}"
      NGINX_ENVSUBST_FILTER: "^APP_TOKEN_HEADER$$"
    depends_on:
      document-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
