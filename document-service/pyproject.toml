[tool.ruff]
# The line length the code already targets; kept for the formatter and for any
# future opt-in to `ruff format`. E501 itself is not enforced (see lint.ignore).
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# High-signal only: pyflakes (undefined names, unused imports/variables,
# f-string mistakes), real pycodestyle errors, and import ordering. Style-only
# rules (line length, quote style, `Optional` vs `X | None`) are deliberately
# left out so the gate flags likely bugs, not cosmetics.
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# Keep re-exported aliases in one grouped import rather than one line each.
combine-as-imports = true
